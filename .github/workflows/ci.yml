name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest

      - name: Run Clojure test suite
        env:
          # Mirrors what `bin/nex` exports before running a script (see cmd_run_script) —
          # the examples smoke test runs contracts_at_work/*/checks.nex in-process via
          # nex.eval, which need NEX_USER_DIR to resolve their scratch directories.
          NEX_USER_DIR: ${{ github.workspace }}
        run: clojure -M:test test/scripts/run_tests.clj
